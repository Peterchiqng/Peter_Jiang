<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  'use strict';
  var BANDS = [8, 12, 16, 20, 24, 28, 32, 36];
  var BCOL = ['#3B6FD9', '#2A82B8', '#12A0A0', '#12A06A', '#C99700', '#F5852F', '#E5484D', '#B03A6B'];
  var PERIODS = [{ n: 3, c: '#7C6BD6' }, { n: 5, c: '#12A06A' }, { n: 10, c: '#2A82B8' }, { n: 99, c: '#F5852F', all: true }];
  var state = { view: 'river', range: '3y', per: 5, noOut: false };
  var M = [], NOW = null, FW = null, META = {};

  function $(s) { return document.querySelector(s); }
  function stats(a) {
    var n = a.length; if (!n) return { mean: 0, std: 0, n: 0, med: 0 };
    var m = a.reduce(function (s, v) { return s + v; }, 0) / n;
    var sd = Math.sqrt(a.reduce(function (s, v) { return s + (v - m) * (v - m); }, 0) / Math.max(n - 1, 1));
    var so = a.slice().sort(function (x, y) { return x - y; });
    return { mean: m, std: sd, n: n, med: so[Math.floor(n / 2)], sorted: so };
  }
  function pctRank(sorted, v) { var c = 0; sorted.forEach(function (x) { if (x <= v) c++; }); return c / sorted.length * 100; }
  function sgn(z) { return (z > 0 ? '+' : '') + z.toFixed(2) + 'σ'; }
  function zc(z) { var a = Math.abs(z); return a >= 2 ? '#E5484D' : a >= 1 ? '#F5852F' : a >= 0.5 ? '#C99700' : '#12A06A'; }
  function qual(z) { var a = Math.abs(z); return a >= 2 ? (z > 0 ? '顯著高估' : '顯著低估') : a >= 1 ? (z > 0 ? '偏高' : '偏低') : '接近均值'; }
  var charts = {};
  function mk(id, cfg) { if (typeof Chart === 'undefined') return; if (charts[id]) charts[id].destroy(); charts[id] = new Chart(document.getElementById(id), cfg); }
  function card(l, v, s, c) { return '<div class="card"><div class="l">' + l + '</div><div class="v" style="color:' + c + '">' + v + '</div><div class="s">' + s + '</div></div>'; }
  var AX = { x: { ticks: { color: '#6A8399', maxTicksLimit: 12, font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: '#6A8399', font: { size: 10 } }, grid: { color: '#E1ECF4' } } };
  function baseOpts(sc) {
    var o = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#36536B', boxWidth: 12, font: { size: 11 } } } }, scales: { x: AX.x, y: AX.y } };
    if (sc) Object.keys(sc).forEach(function (k) { o.scales[k] = sc[k]; });
    return o;
  }

  function monthsAgo(n) { var d = new Date(); d.setMonth(d.getMonth() - n); return d.getFullYear() * 12 + d.getMonth(); }
  function ym(d) { return d.y * 12 + d.m - 1; }

  /* ===== 載入資料：優先讀同站每日更新的 market/data/market.json，其次 data/taiex.json ===== */
  function tryFetch(u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function load() {
    return tryFetch('market/data/market.json').then(function (d) { return { t: d.idx.TAIEX, upd: d.updated, src: 'market/data/market.json' }; })
      .catch(function () { return tryFetch('data/taiex.json').then(function (d) { return { t: d, upd: d.updated, src: 'data/taiex.json' }; }); });
  }
  function build(res) {
    var t = res.t, tr = t.tr;
    M = tr.m.map(function (s, i) { var p = s.split('-'); return { y: +p[0], m: +p[1], lab: s.replace('-', '/'), pe: tr.pe[i], idx: tr.px[i], eps: tr.eps[i] }; });
    NOW = t.now || null; FW = t.fw || null;
    META = { upd: res.upd, src: res.src };
    if (NOW) {
      var p = NOW.d.split('-'), last = M[M.length - 1];
      var pt = { y: +p[0], m: +p[1], lab: p[0] + '/' + p[1] + '/' + p[2], pe: NOW.pe, idx: NOW.px, eps: NOW.eps, cur: true };
      if (last.y === pt.y && last.m === pt.m) M[M.length - 1] = pt; else M.push(pt);
    } else { M[M.length - 1].cur = true; }
    $('#stampTxt').textContent = '更新 ' + (META.upd || '') + ' · 證交所月報';
    $('#srcNote').innerHTML = '資料說明：本益比為證交所月報【大盤本益比】（近四季實際盈餘、月底值，2002 起共 ' + (M.length - 1) + ' 個月），指數收盤取自 Yahoo Finance；EPS 基礎 = 指數 ÷ 本益比。最新一點為最近交易日（' + (NOW ? NOW.d : M[M.length - 1].lab) + '）。預估本益比使用 FactSet 共識的個股預估 EPS 依市值加總，僅涵蓋約 80% 市值，月資料自 2025/02 起。資料由 GitHub Actions 每個交易日自動更新（來源檔 ' + META.src + '）。注意：財報狗、玩股網等網站的本益比計算方式不同（盈餘期間、是否排除虧損公司），數值會和證交所月報有差異。本頁僅供資訊參考，不構成投資建議。';
  }

  function winRows(n, all) {
    var hist = M.slice(0, -1), lo = all ? 0 : monthsAgo(n * 12);
    return hist.filter(function (d) { return (all || ym(d) >= lo) && !(state.noOut && d.pe > 35); });
  }
  function winStats(p) { return stats(winRows(p.n, p.all).map(function (d) { return d.pe; })); }
  function plabel(p) { return p.all ? '2002 起' : '近' + p.n + '年'; }

  function renderTabs() {
    $('#viewTabs').innerHTML = [['river', '河流圖'], ['sigma', '標準差分析'], ['fwd', '預估本益比']].map(function (v) {
      return '<button type="button" class="tab' + (state.view === v[0] ? ' on' : '') + '" data-k="view:' + v[0] + '">' + v[1] + '</button>';
    }).join('');
    if (state.view === 'river') {
      $('#subTabs').innerHTML = [['3y', '近3年'], ['5y', '近5年'], ['10y', '近10年'], ['all', '全部（2002 起）']].map(function (v) {
        return '<button type="button" class="tab' + (state.range === v[0] ? ' on' : '') + '" data-k="range:' + v[0] + '">' + v[1] + '</button>';
      }).join('');
    } else if (state.view === 'sigma') {
      $('#subTabs').innerHTML = PERIODS.map(function (p) {
        var on = state.per === p.n;
        return '<button type="button" class="tab' + (on ? ' on' : '') + '" data-k="per:' + p.n + '">' + plabel(p) + '</button>';
      }).join('') + '<label class="chk"><input type="checkbox" id="outChk"' + (state.noOut ? ' checked' : '') + '> 排除本益比 &gt;35x 的盈餘低谷期</label>';
      var cb = $('#outChk'); if (cb) cb.addEventListener('change', function () { state.noOut = cb.checked; render(); });
    } else { $('#subTabs').innerHTML = ''; }
  }

  function render() {
    renderTabs();
    $('#secTbl').style.display = state.view === 'sigma' ? '' : 'none';
    if (state.view === 'river') renderRiver(); else if (state.view === 'sigma') renderSigma(); else renderFwd();
    renderInsights();
  }

  function renderRiver() {
    $('#warn').textContent = '';
    var rows = M;
    if (state.range !== 'all') { var n = { '3y': 36, '5y': 60, '10y': 120 }[state.range]; rows = M.filter(function (d) { return ym(d) >= monthsAgo(n); }); }
    var c = M[M.length - 1];
    var lo = 0; BANDS.forEach(function (b, i) { if (c.pe >= b) lo = i; });
    var inBand = c.pe >= 36 ? '高於 36x' : c.pe < 8 ? '低於 8x' : BANDS[lo] + 'x – ' + BANDS[lo + 1] + 'x';
    var b24 = c.eps * 24;
    $('#banner').innerHTML = '最新（' + c.lab + '）本益比 <b>' + c.pe.toFixed(2) + 'x</b>，落在 <b>' + inBand + '</b> 河道；指數 ' + Math.round(c.idx).toLocaleString() + ' 點，較 24x 河道（' + Math.round(b24).toLocaleString() + ' 點）' + (c.idx >= b24 ? '高 ' : '低 ') + Math.abs((c.idx / b24 - 1) * 100).toFixed(1) + '%。';
    var pes = rows.map(function (d) { return d.pe; });
    $('#cards').innerHTML = card('最新本益比', c.pe.toFixed(2) + 'x', c.lab, '#F5852F') + card('指數', Math.round(c.idx).toLocaleString(), c.lab, '#2A82B8') +
      card('EPS 基礎（近四季）', Math.round(c.eps).toLocaleString(), '指數 ÷ 本益比', '#12A06A') +
      card('區間最低 PE', Math.min.apply(null, pes).toFixed(2) + 'x', '', '#12A06A') + card('區間最高 PE', Math.max.apply(null, pes).toFixed(2) + 'x', '', '#E5484D') +
      card('區間中位數', stats(pes).med.toFixed(2) + 'x', 'n=' + pes.length, '#7C6BD6');
    $('#mainTitle').innerHTML = 'TAIEX 本益比河流圖 <small>每條線 = 近四季 EPS 基礎 × 倍數</small>';
    var ds = BANDS.map(function (b, i) { return { label: b + 'x', data: rows.map(function (d) { return Math.round(d.eps * b); }), borderColor: BCOL[i], borderWidth: 1, pointRadius: 0, fill: i === 0 ? false : '-1', backgroundColor: BCOL[i] + '33', order: 5 }; });
    ds.push({ label: 'TAIEX', data: rows.map(function (d) { return d.idx; }), borderColor: '#16324A', borderWidth: 2.4, pointRadius: rows.map(function (d) { return d.cur ? 6 : 0; }), pointBackgroundColor: '#F5852F', tension: 0.1, fill: false, order: 0 });
    mk('cMain', { type: 'line', data: { labels: rows.map(function (d) { return d.lab; }), datasets: ds }, options: baseOpts() });
  }

  function renderSigma() {
    var p = PERIODS.filter(function (x) { return x.n === state.per; })[0] || PERIODS[1];
    var cur = M[M.length - 1], rows = winRows(p.n, p.all), st = stats(rows.map(function (d) { return d.pe; }));
    var z = st.std > 0 ? (cur.pe - st.mean) / st.std : 0, pr = pctRank(st.sorted, cur.pe);
    $('#banner').innerHTML = '最新本益比 <b>' + cur.pe.toFixed(2) + 'x</b>，與' + plabel(p) + '每月月底本益比（n=' + st.n + '）比較；' + (state.noOut ? '已排除 >35x 的盈餘低谷月份。' : '含盈餘崩潰期（如 2002–03、2009），標準差會被放大，可用右側開關排除。');
    $('#warn').textContent = st.n < 12 ? '提醒：樣本少於 12 個月，參考性有限。' : '';
    $('#cards').innerHTML = card('最新本益比', cur.pe.toFixed(2) + 'x', cur.lab, '#F5852F') + card(plabel(p) + '均值', st.mean.toFixed(2) + 'x', 'n=' + st.n + ' · 中位數 ' + st.med.toFixed(2), p.c) +
      card('標準差', st.std.toFixed(2), '1σ', '#36536B') + card('Z-score', sgn(z), qual(z), zc(z)) + card('歷史百分位', pr.toFixed(0) + '%', '比 ' + pr.toFixed(0) + '% 的月份貴', zc(z)) + card('+2σ 上界', (st.mean + 2 * st.std).toFixed(2) + 'x', '過熱警戒', '#E5484D');
    $('#mainTitle').innerHTML = '月底本益比 · ' + plabel(p) + ' <small>均值 ' + st.mean.toFixed(2) + 'x · σ ' + st.std.toFixed(2) + '</small>';
    var labels = rows.map(function (d) { return d.lab; }).concat(['最新']);
    function line(name, v, col, dash) { return { label: name + ' ' + v.toFixed(1) + 'x', data: labels.map(function () { return +v.toFixed(2); }), borderColor: col, borderWidth: 1, borderDash: dash || [5, 4], pointRadius: 0, fill: false }; }
    var last = labels.length - 1;
    var ds = [{ label: '本益比', data: rows.map(function (d) { return d.pe; }).concat([cur.pe]), borderColor: '#2A82B8', borderWidth: 2, tension: 0.15, fill: false, pointRadius: labels.map(function (_, i) { return i === last ? 6 : 0; }), pointBackgroundColor: '#F5852F' }];
    [[3, '+3σ', '#B03A6B'], [2, '+2σ', '#E5484D'], [1, '+1σ', '#C99700'], [0, '均值', p.c], [-1, '-1σ', '#C99700'], [-2, '-2σ', '#E5484D']].forEach(function (k) { ds.push(line(k[1], st.mean + k[0] * st.std, k[2], k[0] === 0 ? [] : null)); });
    var o = baseOpts({ y: { ticks: { color: '#6A8399', font: { size: 10 }, callback: function (v) { return v + 'x'; } }, grid: { color: '#E1ECF4' } } });
    o.plugins.tooltip = { filter: function (it) { return it.datasetIndex === 0; } };
    mk('cMain', { type: 'line', data: { labels: labels, datasets: ds }, options: o });
    $('#tblSub').textContent = '最新 ' + cur.pe.toFixed(2) + 'x';
    var h = '<tr><th>期間</th><th>n</th><th>均值</th><th>σ</th><th>-1σ</th><th>+1σ</th><th>+2σ</th><th>+3σ</th><th>Z-score</th><th>百分位</th><th>定性</th></tr>';
    h += PERIODS.map(function (pp) {
      var s = winStats(pp), zz = s.std > 0 ? (cur.pe - s.mean) / s.std : 0;
      return '<tr style="' + (pp.n === state.per ? 'background:' + pp.c + '14' : '') + '"><td style="color:' + pp.c + ';font-weight:700">' + plabel(pp) + '</td><td>' + s.n + '</td><td style="color:' + pp.c + '">' + s.mean.toFixed(2) + '</td><td>' + s.std.toFixed(2) + '</td><td>' + (s.mean - s.std).toFixed(2) + '</td><td>' + (s.mean + s.std).toFixed(2) + '</td><td>' + (s.mean + 2 * s.std).toFixed(2) + '</td><td>' + (s.mean + 3 * s.std).toFixed(2) + '</td><td style="color:' + zc(zz) + ';font-weight:800">' + sgn(zz) + '</td><td>' + pctRank(s.sorted, cur.pe).toFixed(0) + '%</td><td style="color:' + zc(zz) + '">' + qual(zz) + '</td></tr>';
    }).join('');
    $('#tbl').innerHTML = h;
  }

  function renderFwd() {
    $('#warn').textContent = '';
    if (!FW || !FW.d || !FW.d.length) { $('#banner').textContent = '資料檔中沒有預估本益比。'; $('#cards').innerHTML = ''; if (charts.cMain) { charts.cMain.destroy(); delete charts.cMain; } return; }
    var n = FW.d.length, i = n - 1;
    var tpe = FW.d.map(function (_, k) { return +(FW.px[k] / FW.eps[k]).toFixed(2); });
    $('#banner').innerHTML = '最新（' + FW.d[i] + '）預估本益比 <b>' + FW.fpe[i].toFixed(2) + 'x</b>，同一天的近四季本益比 <b>' + tpe[i].toFixed(2) + 'x</b>；市場預期未來 12 個月盈餘約為近四季的 <b>' + FW.g[i].toFixed(2) + ' 倍</b>。';
    var fs = stats(FW.fpe);
    $('#cards').innerHTML = card('預估本益比', FW.fpe[i].toFixed(2) + 'x', FW.d[i], '#F5852F') + card('近四季本益比', tpe[i].toFixed(2) + 'x', '同日 指數÷近四季EPS', '#2A82B8') +
      card('預估 EPS', Math.round(FW.feps[i]).toLocaleString(), '未來 12 個月（加總）', '#12A06A') + card('預估 / 近四季 EPS', FW.g[i].toFixed(2) + 'x', '成長預期', '#7C6BD6') +
      card('預估PE 區間均值', fs.mean.toFixed(2) + 'x', 'n=' + fs.n + '（自 ' + FW.d[0].slice(0, 7) + '）', '#36536B') + card('預估PE Z-score', fs.n > 3 && fs.std > 0 ? sgn((FW.fpe[i] - fs.mean) / fs.std) : '–', '樣本偏少，僅供參考', '#C99700');
    $('#mainTitle').innerHTML = '預估本益比 vs 近四季本益比 <small>預估 EPS 為 FactSet 共識依市值加總（涵蓋約 80% 市值）</small>';
    var o = baseOpts({ y: { ticks: { color: '#6A8399', font: { size: 10 }, callback: function (v) { return v + 'x'; } }, grid: { color: '#E1ECF4' } } });
    mk('cMain', { type: 'line', data: { labels: FW.d, datasets: [
      { label: '近四季本益比', data: tpe, borderColor: '#2A82B8', borderWidth: 2.2, tension: 0.2, pointRadius: 3, fill: false },
      { label: '預估本益比（未來12個月）', data: FW.fpe, borderColor: '#F5852F', borderWidth: 2.2, tension: 0.2, pointRadius: 3, fill: false }] }, options: o });
  }

  function renderInsights() {
    var cur = M[M.length - 1], out = [];
    var s5 = winStats(PERIODS[1]), s10 = winStats(PERIODS[2]), sa = winStats(PERIODS[3]);
    var z5 = (cur.pe - s5.mean) / s5.std, z10 = (cur.pe - s10.mean) / s10.std;
    out.push({ c: '#F5852F', t: '估值位置', b: '最新本益比 ' + cur.pe.toFixed(1) + 'x；近5年均值 ' + s5.mean.toFixed(1) + 'x（' + sgn(z5) + '）、近10年均值 ' + s10.mean.toFixed(1) + 'x（' + sgn(z10) + '）、2002 起均值 ' + sa.mean.toFixed(1) + 'x。' });
    var a = M[M.length - 13] || M[0];
    out.push({ c: '#2A82B8', t: '一年來的變化', b: '相較 ' + a.lab + '，指數 ' + ((cur.idx / a.idx - 1) * 100).toFixed(0) + '%，近四季 EPS 基礎 ' + ((cur.eps / a.eps - 1) * 100).toFixed(0) + '%，本益比由 ' + a.pe.toFixed(1) + 'x 到 ' + cur.pe.toFixed(1) + 'x。' + (cur.idx / a.idx > cur.eps / a.eps ? '指數漲幅大於盈餘成長，評價在擴張。' : '盈餘成長快於指數，評價在壓縮。') });
    var hi = M.slice(0, -1).reduce(function (m, d) { return d.idx > m.idx ? d : m; }, M[0]);
    out.push({ c: '#12A06A', t: '距離高點', b: '月底收盤高點 ' + Math.round(hi.idx).toLocaleString() + '（' + hi.lab + '，本益比 ' + hi.pe.toFixed(1) + 'x）；最新 ' + Math.round(cur.idx).toLocaleString() + '，' + (cur.idx < hi.idx ? '低於高點 ' + ((1 - cur.idx / hi.idx) * 100).toFixed(1) + '%' : '創新高') + '。' });
    if (FW && FW.d && FW.d.length) { var i = FW.d.length - 1; out.push({ c: '#7C6BD6', t: '預估本益比', b: FW.d[i] + ' 預估本益比 ' + FW.fpe[i].toFixed(1) + 'x，低於近四季本益比 ' + (FW.px[i] / FW.eps[i]).toFixed(1) + 'x，因為共識預期未來 12 個月盈餘是近四季的 ' + FW.g[i].toFixed(2) + ' 倍。預估值若下修，這個差距會縮小。' }); }
    out.push({ c: '#E5484D', t: '使用提醒', b: '大盤本益比受半導體權值股影響很大，且採近四季實際盈餘（落後指標）。Z-score 假設分布穩定，對 AI 週期這類結構性變化的參考性有限；盈餘低谷期的高本益比是分母效應，不代表貴。' });
    $('#ins').innerHTML = out.map(function (c) { return '<div class="ins" style="--c:' + c.c + '"><b>' + c.t + '</b><p>' + c.b + '</p></div>'; }).join('');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]'); if (!b) return;
    var kv = b.getAttribute('data-k').split(':'); state[kv[0]] = kv[0] === 'per' ? +kv[1] : kv[1]; render();
  });
  if (typeof Chart !== 'undefined') { Chart.defaults.color = '#36536B'; Chart.defaults.borderColor = '#E1ECF4'; }
  load().then(function (res) { build(res); render(); }).catch(function (e) {
    $('#stampTxt').textContent = '資料載入失敗';
    $('#banner').textContent = '讀不到 market/data/market.json（或 data/taiex.json）。請確認 GitHub Actions 的「大盤估值資料更新」已成功執行過一次。錯誤：' + e.message;
  });
})();
</script>
</body>
</html>
