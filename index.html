<title>投資儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F8FC;--pn:#FFFFFF;--pn2:#F7FBFE;--ln:#E1ECF4;--tx:#16324A;--mu:#6A8399;--dim:#9AAFC0;
  --grad:linear-gradient(125deg,#236C9A 0%,#2A82B8 28%,#3B95C4 55%,#62B6E0 78%,#FFB27A 100%);
  --sh:0 1px 2px rgba(22,50,74,.05),0 8px 24px rgba(22,50,74,.07);--mono:'Nunito','Noto Sans TC',system-ui,sans-serif;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,-apple-system,'Segoe UI',sans-serif}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.wrap{max-width:1200px;margin:0 auto;padding:20px 18px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:700;margin:0 0 10px;color:#16324A}
h2 small{font-weight:400;color:var(--mu);margin-left:8px;font-size:11px}
.sub{margin:5px 0 0;color:var(--mu);font-size:13px}
.stamp{font-size:11px;color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:transparent;color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tab:hover{color:var(--tx)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin:14px 0}
.card{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:11px 13px}
.card .l{font-size:10px;color:var(--mu);margin-bottom:4px}
.card .v{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.1}
.card .s{font-size:10px;color:var(--dim);margin-top:3px}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px 12px 10px;margin-bottom:16px}
.cv{position:relative;height:340px}
.cv.sm{height:270px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--mu);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--pn2)}
td{text-align:right;padding:8px 10px;font-family:var(--mono);border-bottom:1px solid var(--pn2);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:inherit}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.ins{background:var(--pn2);border-radius:8px;padding:12px 14px;border-left:3px solid var(--c)}
.ins b{display:block;font-size:13px;margin-bottom:5px;color:var(--c)}
.ins p{margin:0;font-size:12px;line-height:1.75;color:#36536B}
.warn{font-size:12px;color:#B7791F;margin:0 0 10px}
.note{margin:12px 0 0;font-size:11px;line-height:1.8;color:var(--dim)}
footer{max-width:1200px;margin:0 auto;padding:0 18px 36px;font-size:11px;color:var(--dim)}
</style>
<style>
body{font-family:'Nunito','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.head{background:var(--grad);color:#fff;border-radius:22px;padding:22px 24px;box-shadow:0 10px 30px rgba(42,130,184,.25);align-items:center}
.head h1,.head h1 .gtext{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;color:#fff;background:none;-webkit-text-fill-color:#fff}
.head .sub{color:rgba(255,255,255,.9);font-weight:600}
.head .stamp{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.18);font-weight:700}
h2{color:#16324A;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:16px}
.panel{border-radius:20px;box-shadow:var(--sh);border-color:#E1ECF4}
.card{border-radius:16px;box-shadow:var(--sh);background:#fff}
.card .v{font-family:'Fredoka','Nunito',sans-serif;font-weight:600}
.tab{border-radius:999px;font-weight:700;border-width:1.5px;background:#fff}
.tab.on{background:linear-gradient(90deg,#5FB4E2,#2A82B8)!important;color:#fff!important;border-color:transparent!important}
.ins{background:#F7FBFE;border-radius:12px}
th{background:#F7FBFE;font-weight:800}
.banner{background:#FFF1E4;border-color:#FFD2AE;color:#A8550F}
</style>
<style>
html,body{background:#F3F8FC}
.site-nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 20px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #E1ECF4;font-family:'Nunito','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}
.site-nav .brand{display:inline-flex;align-items:center;gap:9px;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:18px;color:#3B95C4;text-decoration:none;white-space:nowrap}
.site-nav .brand .mk{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #E1ECF4,0 2px 6px rgba(22,50,74,.10);display:inline-flex;align-items:center;justify-content:center}
.site-nav nav{display:flex;gap:4px;flex-wrap:wrap;background:#F7FBFE;border:1px solid #E1ECF4;border-radius:999px;padding:4px}
.site-nav nav a{color:#6A8399;text-decoration:none;font-size:13.5px;font-weight:700;padding:7px 16px;border-radius:999px;border:0;white-space:nowrap}
.site-nav nav a:hover{color:#16324A;border:0}
.site-nav nav a.active{color:#fff;background:linear-gradient(90deg,#5FB4E2 0%,#3B95C4 55%,#2A82B8 100%);box-shadow:0 2px 8px rgba(42,130,184,.30);border:0}
nav.jump{top:58px !important}
@media (max-width:600px){.site-nav .brand span.t{display:none}.site-nav nav{flex:1}.site-nav nav a{padding:7px 10px;flex:1;text-align:center}}
</style>

<main class="wrap">
  <div class="head">
    <div>
      <h1><span class="gtext">S&amp;P 500</span> 預估估值儀表板</h1>
      <p class="sub">預估本益比（未來 12 個月）· 預估EPS · 近四季本益比 ｜ 1年 / 2年 / 3年 / 5年 / 10年 標準差帶分析</p>
    </div>
    <span class="stamp"><span id="stampTxt">載入中…</span></span>
  </div>

  <div class="tabs" id="metricTabs"></div>
  <div class="tabs" id="periodTabs"></div>
  <div class="warn" id="warn"></div>
  <div class="cards" id="cards"></div>

  <section class="panel">
    <h2 id="mainTitle"></h2>
    <div class="cv"><canvas id="cMain"></canvas></div>
  </section>

  <section class="panel">
    <h2>預估本益比 vs 預估EPS <small id="dualSub"></small></h2>
    <div class="cv sm"><canvas id="cDual"></canvas></div>
  </section>

  <section class="panel" id="secAnnual" hidden>
    <h2>年度每股盈餘：實際與預估 <small id="annSub"></small></h2>
    <div class="cv sm"><canvas id="cAnn"></canvas></div>
  </section>

  <section class="panel">
    <h2 id="tblTitle"></h2>
    <div class="tw"><table id="tbl"></table></div>
  </section>

  <section class="panel">
    <h2>關鍵洞察 <small>由頁面內的資料自動計算</small></h2>
    <div class="insights" id="ins"></div>
    <p class="note" id="srcNote"></p>
  </section>
</main>
<footer>© 投資儀表板 · 三個頁面：S&amp;P 500 預估估值、台股大盤本益比、個股儀表板</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  'use strict';
  var PERIODS = [{ key: '1y', n: 1, label: '1年', c: '#7C6BD6' }, { key: '2y', n: 2, label: '2年', c: '#3B6FD9' }, { key: '3y', n: 3, label: '3年', c: '#2A82B8' }, { key: '5y', n: 5, label: '5年', c: '#12A06A' }, { key: '10y', n: 10, label: '10年', c: '#F5852F' }];
  var BASE_METRICS = [
    { key: 'fpe', label: '預估本益比（未來12個月）', unit: 'x', color: '#2A82B8', desc: 'WSJ / Birinyi 共識 · 觀測值' },
    { key: 'feps', label: '預估EPS（未來12個月）', unit: '$', color: '#12A06A', desc: '= 指數 ÷ 預估本益比' },
    { key: 'tpe', label: '近四季本益比', unit: 'x', color: '#F5852F', desc: 'WSJ 公布之 trailing PE' }
  ];
  var EXTRA_METRICS = [
    { key: 'ttm', label: '實際EPS（近四季）', unit: '$', color: '#D96F1F', desc: 'S&P 官方營業 EPS · 近四季加總' },
    { key: 'opPE', label: '營業本益比（實際EPS）', unit: 'x', color: '#7C6BD6', desc: '指數 ÷ S&P 官方近四季營業 EPS' }
  ];
  var METRICS = BASE_METRICS.slice();
  var state = { metric: 'fpe', period: '5y' };
  var R = [], META = {}, EPS = null;

  function $(s) { return document.querySelector(s); }
  function stats(a) {
    var n = a.length; if (!n) return { mean: 0, std: 0, n: 0 };
    var m = a.reduce(function (s, v) { return s + v; }, 0) / n;
    var sd = Math.sqrt(a.reduce(function (s, v) { return s + (v - m) * (v - m); }, 0) / Math.max(n - 1, 1));
    return { mean: m, std: sd, n: n };
  }
  function zColor(z) { var a = Math.abs(z); return a >= 2 ? '#E5484D' : a >= 1 ? '#F5852F' : a >= 0.5 ? '#C99700' : '#12A06A'; }
  function fv(m, v) { if (v == null || isNaN(v)) return '–'; return m.unit === '$' ? '$' + v.toFixed(1) : v.toFixed(2) + 'x'; }
  function sgn(z) { return (z > 0 ? '+' : '') + z.toFixed(2) + 'σ'; }
  function pct(a, b) { var d = (a / b - 1) * 100; return (d > 0 ? '+' : '') + d.toFixed(1) + '%'; }
  function qual(z) { if (z == null) return '–'; var a = Math.abs(z); return a >= 2 ? (z > 0 ? '顯著高估' : '顯著低估') : a >= 1 ? (z > 0 ? '偏高' : '偏低') : '接近均值'; }
  function addDays(ds, n) { var d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function addYears(ds, n) { var d = new Date(ds + 'T00:00:00'); d.setFullYear(d.getFullYear() - n); return d.toISOString().slice(0, 10); }
  var charts = {};
  function mk(id, cfg) { if (typeof Chart === 'undefined') return; if (charts[id]) charts[id].destroy(); charts[id] = new Chart(document.getElementById(id), cfg); }
  function opts(extra) {
    var o = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#36536B', boxWidth: 12, font: { size: 11 } } } },
      scales: { x: { ticks: { color: '#6A8399', font: { size: 10 }, maxTicksLimit: 12 }, grid: { display: false } }, y: { ticks: { color: '#6A8399', font: { size: 10 } }, grid: { color: '#E1ECF4' } } } };
    if (extra) { if (extra.plugins) Object.keys(extra.plugins).forEach(function (k) { o.plugins[k] = extra.plugins[k]; }); if (extra.scales) Object.keys(extra.scales).forEach(function (k) { o.scales[k] = extra.scales[k]; }); }
    return o;
  }

  function tryFetch(u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function load() {
    return tryFetch('market/data/market.json').then(function (d) { return { t: d.idx.SPX, upd: d.updated, src: 'market/data/market.json' }; })
      .catch(function () { return tryFetch('data/spx.json').then(function (d) { return { t: d, upd: d.updated, src: 'data/spx.json' }; }); });
  }
  function build(res) {
    var fw = res.t.fw;
    R = fw.d.map(function (d, i) { return { d: d, px: fw.px[i], fpe: fw.fpe[i], feps: fw.feps[i], tpe: fw.tpe[i] }; });
    METRICS = BASE_METRICS.slice();
    if (EPS && EPS.ttm && EPS.ttm.length) {
      var act = EPS.ttm.filter(function (x) { return !x.est && x.op != null; });
      R.forEach(function (r) {
        var cut = addDays(r.d, -40), best = null;
        act.forEach(function (x) { if (x.d <= cut) best = x; });
        r.ttm = best ? best.op : null; r.opPE = best ? +(r.px / best.op).toFixed(2) : null;
      });
      if (R.some(function (r) { return r.ttm != null; })) METRICS = BASE_METRICS.concat(EXTRA_METRICS);
    }
    META = { upd: res.upd, src: res.src, n: R.length, first: R[0].d, last: R[R.length - 1].d };
    $('#stampTxt').textContent = '更新 ' + (META.upd || '') + ' · 最新觀測 ' + META.last + ' · WSJ';
    $('#srcNote').innerHTML = '資料說明：預估本益比（未來 12 個月）與近四季本益比來自 WSJ「P/Es &amp; Yields on Major Indexes」（預估由 Birinyi Associates 提供，為營業盈餘）；2013 年起的歷史由 Wayback Machine 的每月快照回補，共 ' + META.n + ' 個觀測點，間隔不一定相等（約每 1–2 個月一筆），標準差即以這些觀測值計算。預估EPS = 指數收盤 ÷ 預估本益比。數值與 FactSet 週報（約 12 個月預估 EPS、5 年／10 年均值）不完全相同，因為盈餘定義與預估期間不同。資料由 GitHub Actions 每個交易日自動更新（來源檔 ' + META.src + '）。本頁僅供資訊參考，不構成投資建議。';
  }

  function renderTabs() {
    $('#metricTabs').innerHTML = METRICS.map(function (m) { var on = m.key === state.metric; return '<button type="button" class="tab' + (on ? ' on' : '') + '" data-k="metric:' + m.key + '">' + m.label + '</button>'; }).join('');
    $('#periodTabs').innerHTML = PERIODS.map(function (p) { var on = p.key === state.period; return '<button type="button" class="tab' + (on ? ' on' : '') + '" data-k="period:' + p.key + '">近' + p.label + '</button>'; }).join('');
  }
  function rowsFor(p) { var cut = addYears(META.last, p.n); return R.filter(function (d) { return d.d >= cut; }); }
  function histStats(m, p) { var rows = rowsFor(p).filter(function (d) { return d[m.key] != null; }); return stats(rows.slice(0, -1).map(function (d) { return d[m.key]; })); }

  function render() {
    renderTabs();
    var m = METRICS.filter(function (x) { return x.key === state.metric; })[0];
    var p = PERIODS.filter(function (x) { return x.key === state.period; })[0];
    var rows = rowsFor(p).filter(function (d) { return d[m.key] != null; }), cur = R[R.length - 1][m.key];
    if (state.metric !== m.key) state.metric = m.key;
    var st = stats(rows.map(function (d) { return d[m.key]; }));
    var z = st.std > 0 ? (cur - st.mean) / st.std : null;
    $('#warn').textContent = st.n < 8 ? '提醒：近' + p.label + '只有 ' + st.n + ' 個觀測值，標準差與 Z-score 的參考性有限。' : '';
    $('#cards').innerHTML = [
      { l: '最新值', v: fv(m, cur), s: META.last, c: m.color },
      { l: p.label + '均值', v: fv(m, st.mean), s: 'n=' + st.n, c: p.c },
      { l: p.label + '標準差', v: st.n > 1 ? fv(m, st.std) : '–', s: '1σ', c: '#36536B' },
      { l: 'Z-score', v: z != null ? sgn(z) : '–', s: qual(z), c: z != null ? zColor(z) : '#6A8399' },
      { l: '+2σ 上界', v: fv(m, st.mean + 2 * st.std), s: '過熱警戒', c: '#E5484D' },
      { l: '-1σ 下界', v: fv(m, st.mean - st.std), s: '均值支撐', c: '#12A06A' }
    ].map(function (c) { return '<div class="card"><div class="l">' + c.l + '</div><div class="v" style="color:' + c.c + '">' + c.v + '</div><div class="s">' + c.s + '</div></div>'; }).join('');

    $('#mainTitle').innerHTML = m.label + ' · 近' + p.label + '　均值 <span style="color:' + p.c + '">' + fv(m, st.mean) + '</span>　σ ' + fv(m, st.std) + ' <small>' + m.desc + '</small>';
    var labels = rows.map(function (d) { return d.d; });
    function cl(label, v, col, dash) { return { label: label + ' ' + fv(m, v), data: rows.map(function () { return +v.toFixed(3); }), borderColor: col, borderWidth: 1, borderDash: dash || [5, 4], pointRadius: 0, fill: false }; }
    var ds = [{ label: m.label, data: rows.map(function (d) { return d[m.key]; }), borderColor: m.color, borderWidth: 2.2, tension: 0.2, fill: true, backgroundColor: m.color + '1F',
      pointRadius: rows.map(function (d, i) { return i === rows.length - 1 ? 6 : (rows.length > 40 ? 0 : 3); }), pointBackgroundColor: rows.map(function (d, i) { return i === rows.length - 1 ? '#F5852F' : m.color; }) }];
    if (st.n >= 2) { ds.push(cl('均值', st.mean, p.c, [])); ds.push(cl('+1σ', st.mean + st.std, '#C99700')); ds.push(cl('-1σ', st.mean - st.std, '#C99700')); ds.push(cl('+2σ', st.mean + 2 * st.std, '#E5484D')); ds.push(cl('-2σ', st.mean - 2 * st.std, '#E5484D')); }
    mk('cMain', { type: 'line', data: { labels: labels, datasets: ds }, options: opts({ plugins: { tooltip: { filter: function (it) { return it.datasetIndex === 0; } } } }) });

    $('#dualSub').textContent = '近' + p.label;
    mk('cDual', { data: { labels: labels, datasets: [
      { type: 'line', label: '預估本益比 (左軸)', data: rows.map(function (d) { return d.fpe; }), borderColor: '#2A82B8', borderWidth: 2.2, pointRadius: 0, tension: 0.2, yAxisID: 'y', order: 0 },
      { type: 'line', label: '近四季本益比 (左軸)', data: rows.map(function (d) { return d.tpe; }), borderColor: '#F5852F', borderWidth: 1.6, borderDash: [6, 3], pointRadius: 0, tension: 0.2, yAxisID: 'y', order: 1 },
      { type: 'bar', label: '預估EPS (右軸)', data: rows.map(function (d) { return d.feps; }), backgroundColor: 'rgba(18,160,106,.22)', borderColor: '#12A06A', borderWidth: 1, yAxisID: 'y1', order: 2 }] },
      options: opts({ scales: { y: { position: 'left', ticks: { color: '#2A82B8', font: { size: 10 }, callback: function (v) { return v + 'x'; } }, grid: { color: '#E1ECF4' } }, y1: { position: 'right', beginAtZero: true, ticks: { color: '#12A06A', font: { size: 10 }, callback: function (v) { return '$' + v; } }, grid: { display: false } } } }) });

    $('#tblTitle').innerHTML = m.label + ' — 五段時間統計 <small>最新值 ' + fv(m, cur) + '</small>';
    var h = '<tr><th>時間段</th><th>n</th><th>均值</th><th>σ</th><th>-2σ</th><th>-1σ</th><th>+1σ</th><th>+2σ</th><th>Z-score</th><th>定性</th></tr>';
    h += PERIODS.map(function (pp) {
      var s = stats(rowsFor(pp).filter(function (d) { return d[m.key] != null; }).map(function (d) { return d[m.key]; })), zz = s.std > 0 ? (cur - s.mean) / s.std : null, ok = s.n > 1;
      var cells = [-2, -1, 1, 2].map(function (k) { return '<td>' + (ok ? fv(m, s.mean + k * s.std) : '–') + '</td>'; }).join('');
      return '<tr style="' + (pp.key === state.period ? 'background:' + pp.c + '14' : '') + '"><td style="color:' + pp.c + ';font-weight:700">近' + pp.label + '</td><td>' + s.n + '</td><td style="color:' + pp.c + '">' + fv(m, s.mean) + '</td><td>' + (ok ? fv(m, s.std) : '–') + '</td>' + cells +
        '<td style="color:' + (zz != null ? zColor(zz) : '#6A8399') + ';font-weight:800">' + (zz != null ? sgn(zz) : '–') + '</td><td style="color:' + (zz != null ? zColor(zz) : '#6A8399') + '">' + qual(zz) + '</td></tr>';
    }).join('');
    $('#tbl').innerHTML = h;
    renderInsights();
    renderAnnual();
  }

  function renderAnnual() {
    var sec = $('#secAnnual');
    if (!EPS || !EPS.annual || !Object.keys(EPS.annual).length) { sec.hidden = true; return; }
    var ys = Object.keys(EPS.annual).sort().filter(function (y) { return EPS.annual[y].op != null && +y >= new Date().getFullYear() - 9; });
    if (!ys.length) { sec.hidden = true; return; }
    sec.hidden = false;
    $('#annSub').textContent = '營業EPS · 實際 vs 預估 · 資料更新 ' + (EPS.updated || '');
    mk('cAnn', { type: 'bar', data: { labels: ys.map(function (y) { return EPS.annual[y].est ? y + 'E' : y; }), datasets: [
      { label: '營業EPS', data: ys.map(function (y) { return EPS.annual[y].op; }), backgroundColor: ys.map(function (y) { return EPS.annual[y].est ? 'rgba(245,133,47,.35)' : 'rgba(42,130,184,.55)'; }), borderColor: ys.map(function (y) { return EPS.annual[y].est ? '#F5852F' : '#2A82B8'; }), borderWidth: 1 },
      { label: 'As Reported EPS', data: ys.map(function (y) { return EPS.annual[y].rep; }), backgroundColor: 'rgba(18,160,106,.25)', borderColor: '#12A06A', borderWidth: 1 }] }, options: opts({ scales: { y: { beginAtZero: true, ticks: { color: '#6A8399', font: { size: 10 }, callback: function (v) { return '$' + v; } }, grid: { color: '#E1ECF4' } } } }) });
  }

  function nearest(date) { var best = R[0]; R.forEach(function (d) { if (d.d <= date) best = d; }); return best; }
  function renderInsights() {
    var c = R[R.length - 1], m = METRICS[0];
    var s5 = histStats(m, PERIODS[3]), s10 = histStats(m, PERIODS[4]);
    var z5 = (c.fpe - s5.mean) / s5.std, z10 = (c.fpe - s10.mean) / s10.std;
    var y1 = nearest(addYears(c.d, 1));
    var mx = R.reduce(function (a, d) { return d.fpe > a.fpe ? d : a; }, R[0]), mn = R.reduce(function (a, d) { return d.fpe < a.fpe ? d : a; }, R[0]);
    var cards = [
      { c: '#2A82B8', t: '估值位置', b: '最新預估本益比 ' + c.fpe.toFixed(1) + 'x（' + c.d + '）；近5年均值 ' + s5.mean.toFixed(1) + 'x（' + sgn(z5) + '）、近10年均值 ' + s10.mean.toFixed(1) + 'x（' + sgn(z10) + '）。' },
      { c: '#12A06A', t: '預估 EPS 變化', b: '預估EPS 由 ' + y1.d + ' 的 $' + y1.feps.toFixed(0) + ' 到 $' + c.feps.toFixed(0) + '（' + pct(c.feps, y1.feps) + '），指數同期 ' + pct(c.px, y1.px) + '。' + (c.px / y1.px > c.feps / y1.feps ? '指數漲幅大於預估盈餘，評價在擴張。' : '預估盈餘成長快於指數，評價在壓縮。') },
      { c: '#F5852F', t: '預估 vs 近四季', b: '預估本益比 ' + c.fpe.toFixed(1) + 'x，近四季本益比 ' + c.tpe.toFixed(1) + 'x，兩者落差 ' + (c.tpe - c.fpe).toFixed(1) + ' 點，反映市場預期未來 12 個月盈餘成長約 ' + ((c.tpe / c.fpe - 1) * 100).toFixed(0) + '%。預估若下修，落差會縮小。' },
      { c: '#7C6BD6', t: '觀測區間極值', b: '2013 年以來預估本益比最高 ' + mx.fpe.toFixed(1) + 'x（' + mx.d + '），最低 ' + mn.fpe.toFixed(1) + 'x（' + mn.d + '）；最新值在區間的 ' + ((c.fpe - mn.fpe) / (mx.fpe - mn.fpe) * 100).toFixed(0) + '% 位置。' }
    ];
    $('#ins').innerHTML = cards.map(function (x) { return '<div class="ins" style="--c:' + x.c + '"><b>' + x.t + '</b><p>' + x.b + '</p></div>'; }).join('');
  }

  document.addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (!b) return; var kv = b.getAttribute('data-k').split(':'); state[kv[0]] = kv[1]; render(); });
  if (typeof Chart !== 'undefined') { Chart.defaults.color = '#36536B'; Chart.defaults.borderColor = '#E1ECF4'; }
  function loadEps() {
    return tryFetch('market/data/spx_eps.json').catch(function () { return tryFetch('data/spx_eps.json'); })
      .then(function (d) { return (d && d.ttm && d.ttm.length) ? d : null; }).catch(function () { return null; });
  }
  load().then(function (res) { return loadEps().then(function (e) { EPS = e; build(res); render(); }); }).catch(function (e) {
    $('#stampTxt').textContent = '資料載入失敗';
    $('#warn').textContent = '讀不到 market/data/market.json（或 data/spx.json）。請確認 GitHub Actions 的「大盤估值資料更新」已成功執行。錯誤：' + e.message;
  });
})();
</script>
</body>
</html>
